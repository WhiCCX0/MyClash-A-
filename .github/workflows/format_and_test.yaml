name: format_and_test

on:
  push:
    branches: ['main']
    paths:
      - 'Script/*'
      - 'Test/**'
      - 'tools/*.cjs'
      - '**/*.yaml'
      - '**/*.yml'
      - '.prettierrc*'
  pull_request:
    paths:
      - 'Script/*'
      - 'Test/**'
      - 'tools/*.cjs'
      - '**/*.yaml'
      - '**/*.yml'
      - '.prettierrc*'
  workflow_dispatch:

concurrency:
  group: format-and-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Test/package-lock.json

      - name: Install locked test dependencies
        run: npm ci --prefix Test

      - name: Install pinned formatter
        run: npm install -g prettier@3.9.10

      - name: Check formatting without changing repository files
        run: |
          git ls-files -z '*.js' '*.cjs' '*.yml' '*.yaml' | xargs -0 -r prettier --check

      - name: Run tests
        run: node Test/run-tests.js
