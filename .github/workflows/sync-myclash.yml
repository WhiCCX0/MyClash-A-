name: Daily MyClash + Claude + Gemini routes
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'gemini-route.json'
      - 'claude-route.json'
      - '.github/workflows/sync-myclash.yml'
  pull_request:
    paths:
      - 'tools/**'
      - 'gemini-route.json'
      - 'claude-route.json'
      - '.github/workflows/sync-myclash.yml'

concurrency:
  group: myclash-sync-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync upstream and inject routes
        run: node tools/sync-upstream.cjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Format generated scripts
        run: |
          npm install -g prettier
          prettier --write Script/mihomoScript.js Script/Script.js
      - name: Check generated scripts and routing tests
        run: |
          node --check Script/mihomoScript.js
          node --check Script/Script.js
          node tools/test-claude.cjs
          node tools/test-gemini.cjs
          git diff --check
      - name: Upload verified scripts
        uses: actions/upload-artifact@v4
        with:
          name: myclash-generated-scripts
          path: |
            Script/mihomoScript.js
            Script/Script.js
          if-no-files-found: error

  publish:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch' ||
       github.event_name == 'push')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download verified scripts
        uses: actions/download-artifact@v4
        with:
          name: myclash-generated-scripts
          path: generated
      - name: Commit verified scripts only if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            echo "Publish attempt ${attempt}/3"
            git fetch origin main
            git reset --hard origin/main
            cp generated/Script.js Script/Script.js
            cp generated/mihomoScript.js Script/mihomoScript.js
            test -f Script/Script.js && test -f Script/mihomoScript.js
            test ! -e Script.js && test ! -e mihomoScript.js
            git diff --check
            git add Script/Script.js Script/mihomoScript.js
            if git diff --cached --quiet; then
              echo 'No generated script changes'
              exit 0
            fi
            git commit -m "chore: sync MyClash upstream with Claude and Gemini routes"
            if git push origin HEAD:main; then
              echo "Published scripts on attempt ${attempt}/3"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Push failed on attempt ${attempt}/3; retrying in 5 seconds"
              sleep 5
            fi
          done
          echo 'Failed to publish verified scripts after 3 attempts' >&2
          exit 1
